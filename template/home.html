<template id="home">
    <section class="landingIntro" aria-label="Prologo de la mazmorra">
        <div class="landingIntroOverlay" id="pantallaNegraLanding">Invocando la mazmorra...</div>

        <article class="landingIntroPanel">
            <section class="landingIntroVideo" aria-label="Secuencia cinematica de entrada">
                <video id="videoLanding1" class="videoSecuenciaLanding activo" playsinline preload="auto">
                    <source src="videos/VideoGenerado1.mp4" type="video/mp4">
                </video>

                <video id="videoLanding2" class="videoSecuenciaLanding" playsinline preload="auto">
                    <source src="videos/VideoGenerado2.mp4" type="video/mp4">
                </video>

                <div class="veloTransicionLanding" id="veloTransicionLanding" aria-hidden="true"></div>
            </section>

            <p id="avisoAudioLanding" class="avisoAudioLanding" aria-live="polite"></p>

            <div class="controlesLanding">
                <button type="button" class="boton controlAudioLanding" id="btnAudioLanding" aria-pressed="false">Silenciar</button>
                <button type="button" class="boton irJuegoLanding" id="btnInicio">Ir al juego</button>
            </div>
        </article>
    </section>
</template>
